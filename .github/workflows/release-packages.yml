name: Build release packages

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  pkg-deb:
    name: Package for ${{matrix.distro}} ${{matrix.version}}
    strategy:
      matrix:
        include:
          - { distro: ubuntu, version: 22.04, image: 'ghcr.io/nickg/nvc-ubuntu-builder:22.04' }
          - { distro: ubuntu, version: 24.04, image: 'ghcr.io/nickg/nvc-ubuntu-builder:24.04' }
          - { distro: ubuntu, version: 26.04, image: 'ghcr.io/nickg/nvc-ubuntu-builder:26.04' }
          - { distro: debian, version: 12, image: 'debian:12' }
          - { distro: debian, version: 13, image: 'debian:13' }
    runs-on: ubuntu-latest
    container:
      image: ${{matrix.image}}
    steps:
      - name: Install packaging tools
        run: |
          apt-get -y update
          DEBIAN_FRONTEND=noninteractive apt-get -y install \
            --no-install-recommends git ca-certificates dpkg-dev
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Get version
        id: version
        run: |
          vers=$(sed -n '1s/AC_INIT(\[.*\], \[\([0-9\.]*\).*\].*/\1/p' configure.ac)
          echo "VERSION=$vers" >> $GITHUB_ENV
      - name: Build Debian package
        run: |
          ln -s contrib/debian debian
          DEBIAN_FRONTEND=noninteractive apt-get -y build-dep ./
          sed -i 's/nvc (.*)/nvc (${{ env.VERSION }}-1)/' debian/changelog
          dpkg-buildpackage -uc -us -b
          mv ../nvc_${{ env.VERSION }}-1_amd64.deb nvc_${{ env.VERSION }}-1_amd64_${{ matrix.distro }}-${{ matrix.version }}.deb
      - name: 'Upload artifact'
        uses: actions/upload-artifact@v4
        with:
          name: '${{matrix.distro}}-${{matrix.version}} package'
          path: nvc_${{ env.VERSION }}-1_amd64_${{ matrix.distro }}-${{ matrix.version }}.deb

  msi-installer:
    name: Windows installer
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build MSI installer
        uses: ./.github/actions/windows-installer

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Build Docker image
        run: ./contrib/docker/build.sh
      - uses: actions/checkout@v6
        with:
          repository: nickg/vhdl-projects
          path: vhdl-projects
          fetch-depth: 1
      - name: Test
        run: |
          docker run --rm -v $(pwd)/vhdl-projects:/data \
            ghcr.io/nickg/nvc:latest /data/flopoco/test.sh
      - name: Login to ghcr.io
        run : |
          echo "${{ secrets.GHCR_TOKEN }}" | \
            docker login -u ${{ vars.GHCR_USER }} --password-stdin ghcr.io
      - name: Push release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          vers=$(sed -n '1s/AC_INIT(\[.*\], \[\([0-9\.]*\).*\].*/\1/p' configure.ac)
          docker push ghcr.io/nickg/nvc:latest
          docker tag ghcr.io/nickg/nvc:latest ghcr.io/nickg/nvc:$vers
          docker push ghcr.io/nickg/nvc:$vers
